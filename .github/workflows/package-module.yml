name: Package and Release Bears Julian Clock Module

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths-ignore:
      - 'stats/**'
  workflow_dispatch:

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'update-stats')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Joomla Extension Packager
        id: package
        uses: N6REJ/joomla-packager@2026.10.2
        with:
          extension-name: 'mod_julianclock'
          extension-xml: 'mod_julianclock.xml'
          extension-type: 'module'
          # Match Joomla 4, 5 and 6 so all supported installs are offered the update;
          # only applied when updates.xml does not already declare a platform.
          targetplatform-version: '[456]\.[0-9]+'
          author: 'N6REJ'
          copyright-holder: 'N6REJ'
          copyright-start-year: '2025'
          license-file: 'License.txt'
          update-joomla-server: 'true'
          commit-changes: 'true'
          upload-artifact: 'false'
          github-token: ${{ secrets.GH_PAT }}

      - name: Upload extension package files
        uses: actions/upload-artifact@v7 # v7.0.1 (Node 24)
        with:
          name: mod_julianclock_${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.package-path }}
          retention-days: 90
          if-no-files-found: warn
